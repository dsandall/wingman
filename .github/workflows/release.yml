name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build Python package
        run: uv build

      - name: Build Debian package
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/out" debian:trixie bash -lc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential debhelper dh-python dpkg-dev pybuild-plugin-pyproject python3-all \
              python3-hatchling python3-pytest python3-rich python3-typer
            cp -a /src /work
            cd /work
            dpkg-buildpackage -us -uc -b
            cp /wingman_*_all.deb /out/
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
